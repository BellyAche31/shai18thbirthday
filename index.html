<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Relative, not /favicon.svg — the site is served from a subpath on
         GitHub Pages, so a root-absolute path 404s. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Shaina reigns at 18 — a new chapter, a timeless reign. Saturday, September 26, 2026 at Dos Casa De Amena." />
    <title>Shaina Reigns at 18 — You're Invited</title>

    <!-- Share preview, so the link shows a proper card in Messenger, Facebook
         and iMessage instead of a bare URL. Social scrapers won't resolve
         relative paths, so the image URL has to be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shaina Reigns at 18" />
    <meta property="og:title" content="Shaina Reigns at 18 — You're Invited" />
    <meta property="og:description" content="A new chapter, a timeless reign. Saturday, September 26, 2026 · Five o'clock · Dos Casa De Amena." />
    <meta property="og:url" content="https://bellyache31.github.io/shai18thbirthday/" />
    <meta property="og:image" content="https://bellyache31.github.io/shai18thbirthday/images/photo-01.jpg" />
    <meta property="og:image:alt" content="Shaina, the celebrant" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shaina Reigns at 18 — You're Invited" />
    <meta name="twitter:description" content="A new chapter, a timeless reign. Saturday, September 26, 2026 · Five o'clock · Dos Casa De Amena." />
    <meta name="twitter:image" content="https://bellyache31.github.io/shai18thbirthday/images/photo-01.jpg" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=Tangerine:wght@400;700&display=swap"
